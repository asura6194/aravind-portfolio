<!doctype html>
<html lang="en" class="is-loading">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Aravind R — Full Stack Web Developer in Bengaluru. Web apps, APIs, and 3D experiences."
    />
    <title>Aravind R — Full Stack Web Developer</title>
    <style>
      html,
      body {
        margin: 0;
        background: #121018;
      }
      html.is-loading,
      html.is-loading body {
        overflow: hidden;
        background: #121018;
      }
      html.is-loading body > :not(#loading-screen) {
        visibility: hidden !important;
        pointer-events: none !important;
      }
      #loading-screen {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        width: 100%;
        height: 100%;
        background: #121018;
        visibility: visible !important;
        pointer-events: all;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div
      id="loading-screen"
      class="loading-screen"
      role="status"
      aria-live="polite"
      aria-label="Loading"
    ></div>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <a class="logo" href="#hero">A<span class="logo-r">R</span></a>
      <button
        class="nav-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="site-nav"
      >
        <span class="nav-toggle-bar"></span>
        <span class="sr-only">Menu</span>
      </button>
      <nav id="site-nav" class="site-nav" aria-label="Primary">
        <a href="#about">About</a>
        <a href="#experience">Experience</a>
        <a href="#skills">Skills</a>
        <a href="#education">Education</a>
        <a href="#contact">Contact</a>
      </nav>
    </header>

    <main id="main">
      <section id="hero" class="hero">
        <img
          class="hero-bg"
          src="%BASE_URL%images/portrait.jpeg"
          alt=""
          width="1600"
          height="900"
          fetchpriority="low"
        />
        <div class="hero-fade" aria-hidden="true"></div>
        <div class="hero-copy">
          <h1 data-hero-name></h1>
          <p class="lede" data-hero-title></p>
          <p class="hero-summary" data-hero-summary></p>
          <div class="hero-actions">
            <a class="btn btn-primary" href="#contact">Get in touch</a>
            <!-- <a class="btn btn-ghost" href="#featured">See featured work</a> -->
          </div>
        </div>
      </section>

      <div id="page-body" class="page-body">
        <canvas id="dust-canvas" aria-hidden="true"></canvas>

        <section id="about" class="section" data-animate>
          <h2>About</h2>
          <article class="about-card hex-panel">
            <p class="about-text" data-about></p>
          </article>
        </section>

        <section id="experience" class="section" data-animate>
          <h2>Experience</h2>
          <ol class="timeline" data-experience></ol>
        </section>

        <section id="skills" class="section" data-animate>
          <h2>Skills</h2>
          <div class="skills-grid" data-skills></div>
        </section>

        <section id="education" class="section" data-animate>
          <h2>Education</h2>
          <article class="edu-card hex-panel">
            <p class="eyebrow">Degree</p>
            <h3 data-edu-degree></h3>
            <p data-edu-meta></p>
          </article>
        </section>

        <section id="contact" class="section" data-animate>
          <h2>Contact</h2>
          <article class="contact-card hex-panel">
            <p class="contact-lead">
              Open to conversations about web products, 3D on the web, and full
              stack work.
            </p>
            <ul class="contact-list" data-contact></ul>
          </article>
        </section>

      </div>
    </main>

    <footer class="site-footer">
      <p data-footer></p>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
